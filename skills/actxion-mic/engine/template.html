<!doctype html>
<html lang="en" data-resolution="portrait">
<head>
<meta charset="UTF-8" /><meta name="viewport" content="width=1080, height=1920" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0b0e1a}
#root{width:100%;height:100%;position:relative;font-family:Inter,sans-serif;color:#fff}
#world{position:absolute;inset:0;width:1080px;height:1920px}
#grade{position:absolute;inset:0;pointer-events:none;background:
  radial-gradient(120% 75% at 50% 45%,rgba(0,0,0,0) 55%,rgba(3,4,10,.7) 100%),
  linear-gradient(180deg,rgba(5,6,14,.75) 0%,rgba(5,6,14,0) 20%,rgba(5,6,14,0) 62%,rgba(5,6,14,.75) 100%)}
#brand{position:absolute;top:180px;left:70px;font:800 30px Inter;letter-spacing:.18em;color:rgba(255,255,255,.85);display:flex;gap:14px;align-items:center}
#brand i{width:16px;height:16px;border-radius:50%;background:#E61E28;box-shadow:0 0 18px #E61E28}
#rec{position:absolute;top:180px;right:250px;font:700 26px Inter;letter-spacing:.14em;color:rgba(255,255,255,.75)}
.ov,.cap{position:absolute;left:0;width:1080px}
.ov .in,.cap .in{width:100%;text-align:center}
.loc{top:240px}.loc .in{text-align:left;padding-left:70px}
.loc span{display:inline-block;font:800 26px Inter;letter-spacing:.14em;color:#fff;background:#E61E28;padding:8px 18px;border-radius:6px}
.who{top:1290px}.who .in{text-align:left;padding-left:70px}
.wl{display:inline-block;font:400 70px/1 'League Gothic';letter-spacing:.02em;background:#fff;color:#0b0e1a;padding:8px 20px 2px;border-left:12px solid #E61E28}
.ws{font:700 30px Inter;color:#dfe3ee;margin-top:10px;text-shadow:0 2px 10px rgba(0,0,0,.8)}
.qcard{top:0;height:1920px;background:rgba(6,7,14,.55)}
.qcard .in{position:absolute;top:560px}
.qk{font:900 46px Inter;letter-spacing:.42em;color:#E61E28}
.qt{font:400 190px/0.92 'League Gothic';text-transform:uppercase;margin-top:18px;text-shadow:0 8px 40px rgba(0,0,0,.7)}
.qt b{color:#ffd54a;font-weight:400}
.meter{top:250px}
.mt{font:900 30px Inter;letter-spacing:.3em;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.8)}
.gauge{display:flex;align-items:center;justify-content:center;gap:18px;margin-top:14px}
.gauge span{font:400 54px 'League Gothic';letter-spacing:.03em;width:170px;text-shadow:0 2px 12px rgba(0,0,0,.8)}
.gl{text-align:right;color:#ff5a5f}.gr{text-align:left;color:#ffd54a}
.track{position:relative;width:520px;height:22px;border-radius:11px;background:linear-gradient(90deg,#ff5a5f,#3a3d4a 50%,#ffd54a);box-shadow:0 4px 20px rgba(0,0,0,.6)}
.needle{position:absolute;left:50%;top:-14px;width:12px;height:50px;margin-left:-6px;border-radius:6px;background:#fff;box-shadow:0 0 16px rgba(255,255,255,.8)}
.up{display:inline-block;margin-top:18px;font:900 36px Inter;letter-spacing:.12em;color:#0b0e1a;background:#7cc7ff;padding:8px 22px;border-radius:999px;opacity:0}
.ask{top:330px}
.q{font:400 170px/0.92 'League Gothic';text-transform:uppercase;text-shadow:0 6px 30px rgba(0,0,0,.7)}
.q.a{color:#ff5a5f}.q.b{color:#ffd54a}
.or{font:800 50px Inter;color:#dfe3ee;margin:10px 0}
.next{margin-top:60px;font:800 48px Inter;display:inline-block;background:#fff;color:#0b0e1a;padding:16px 34px;border-radius:999px}
.cap{top:1150px}
.cap .in{font:900 74px/1.08 Inter;padding:0 100px;-webkit-text-stroke:10px rgba(4,6,14,.92);paint-order:stroke fill;text-shadow:0 8px 22px rgba(0,0,0,.55)}
.cap .w{display:inline-block;color:rgba(255,255,255,.42)}
.cap .ln{white-space:nowrap}
#end{position:absolute;inset:0;background:#0b0e1a;display:flex;flex-direction:column;align-items:center;justify-content:center}
#end .mic{width:90px;height:90px;border-radius:50%;background:#E61E28;box-shadow:0 0 50px rgba(230,30,40,.7);margin-bottom:40px}
#end .e1{font:400 220px/0.9 'League Gothic';color:#fff}
#end .e2{font:800 46px Inter;letter-spacing:.3em;margin-top:14px;color:#E61E28}
#end .e3{font:600 42px Inter;color:#c9cede;margin-top:50px}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="{{END}}" data-width="1080" data-height="1920">
  <canvas id="world" class="clip" data-start="0" data-duration="{{END}}" data-track-index="0" width="1080" height="1920"></canvas>
  <div id="grade" class="clip" data-start="0" data-duration="{{END}}" data-track-index="1"></div>
  <div id="brand" class="clip" data-start="0" data-duration="{{ENDCARD}}" data-track-index="1"><i></i>THE MIC · ACTXION</div>
{{OVERLAYS}}
{{CAPTIONS}}
  <div id="end" class="clip" data-start="{{ENDCARD}}" data-duration="{{ENDDUR}}" data-track-index="4"><div class="mic"></div><div class="e1">THE MIC</div><div class="e2">BY ACTXION</div><div class="e3">{{ENDLINE}}</div></div>
</div>
<script>window.EP = {{EP}};</script>
<script type="module" src="assets/world.js"></script>
<script>
const tl = gsap.timeline({ paused: true });
const S = el => parseFloat(el.dataset.start), E = el => S(el) + parseFloat(el.dataset.duration);
// whip blur on every cut
{{CUTS}}.forEach(c => { tl.fromTo('#world', { filter: 'blur(0px)' }, { filter: 'blur(14px)', duration: .17, ease: 'power2.in' }, c - .02);
  tl.to('#world', { filter: 'blur(0px)', duration: .2, ease: 'power2.out' }, c + .15); });
document.querySelectorAll('.ov').forEach(el => {
  const s = S(el), e = E(el), inn = el.querySelector('.in'), k = el.className;
  if (k.includes('qcard')) {
    tl.fromTo(el, { opacity: 0 }, { opacity: 1, duration: .15 }, s);
    tl.fromTo(inn, { scale: 1.25, opacity: 0, filter: 'blur(12px)' }, { scale: 1, opacity: 1, filter: 'blur(0px)', duration: .3, ease: 'expo.out' }, s);
    tl.to(el, { opacity: 0, duration: .2 }, e - .2);
  } else if (k.includes('who')) {
    tl.fromTo(el.querySelector('.wl'), { x: -420, opacity: 0 }, { x: 0, opacity: 1, duration: .3, ease: 'expo.out' }, s);
    tl.fromTo(el.querySelector('.ws'), { x: -60, opacity: 0 }, { x: 0, opacity: 1, duration: .3, ease: 'power3.out' }, s + .12);
    tl.to(inn, { opacity: 0, duration: .15 }, Math.min(e, s + 2.6) - .15);
  } else if (k.includes('meter')) {
    tl.fromTo(inn, { y: -40, opacity: 0 }, { y: 0, opacity: 1, duration: .3, ease: 'back.out(1.8)' }, s);
    {{MOVES}}.forEach(([t, v]) => { const nd = el.querySelector('.needle');
      if (v !== 'third') tl.to(nd, { x: v * 255, y: 0, scaleY: 1, duration: .55, ease: 'back.out(2.2)' }, t);
      else { tl.to(nd, { x: 0, duration: .3, ease: 'power2.inOut' }, t); tl.to(nd, { y: -40, scaleY: .6, duration: .25, ease: 'back.out(3)' }, t + .1);
             tl.fromTo(el.querySelector('.up'), { opacity: 0, y: 20, scale: .7 }, { opacity: 1, y: 0, scale: 1, duration: .3, ease: 'back.out(2.5)' }, t + .1); } });
    tl.to(inn, { opacity: 0, duration: .2 }, e - .2);
  } else if (k.includes('ask')) {
    el.querySelectorAll('.q').forEach((q, i) => tl.fromTo(q, { x: i ? 320 : -320, opacity: 0 }, { x: 0, opacity: 1, duration: .35, ease: 'power3.out' }, s + i * .55));
    tl.fromTo(el.querySelector('.or'), { opacity: 0 }, { opacity: 1, duration: .2 }, s + .3);
    el.querySelectorAll('[data-at]').forEach(p => tl.fromTo(p, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: .25, ease: 'back.out(2)' }, s + parseFloat(p.dataset.at)));
  } else {
    tl.fromTo(inn, { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: .3, ease: 'back.out(1.8)' }, s);
    tl.to(inn, { opacity: 0, duration: .15 }, e - .16);
  }
});
document.querySelectorAll('.cap').forEach(el => {
  const s = S(el), e = E(el), inn = el.querySelector('.in'), key = el.querySelector('.ln').dataset.k;
  tl.fromTo(inn, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: .1 }, s);
  el.querySelectorAll('.w').forEach(w => { const ws = s + Math.max(0, parseFloat(w.dataset.ws));
    tl.fromTo(w, { color: 'rgba(255,255,255,.42)', scale: 1 }, { color: w.classList.contains('k') ? key : '#ffffff', scale: 1.06, duration: .08, ease: 'power2.out' }, ws).to(w, { scale: 1, duration: .12 }, ws + .08); });
  tl.to(inn, { opacity: 0, duration: .08 }, e - .09);
});
tl.fromTo('#end .mic', { scale: 0 }, { scale: 1, duration: .35, ease: 'back.out(3)' }, {{ENDCARD}});
tl.fromTo('#end .e1', { scale: .6, opacity: 0 }, { scale: 1, opacity: 1, duration: .35, ease: 'back.out(2)' }, {{ENDCARD}} + .1);
tl.fromTo('#end .e3', { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: .3 }, {{ENDCARD}} + .6);
window.__timelines = window.__timelines || {};
window.__timelines["main"] = tl; tl.seek(0);
</script>
</body></html>
